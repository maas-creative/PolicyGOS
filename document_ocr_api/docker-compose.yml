services:
  yomitoku-api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./uploads:/app/document_ocr_api/uploads
      - ./logs:/app/document_ocr_api/logs
    environment:
      OCR_DEPLOYMENT: local
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/ready', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: GPU-enabled version (requires nvidia-docker)
  yomitoku-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./uploads:/app/document_ocr_api/uploads
      - ./logs:/app/document_ocr_api/logs
    environment:
      OCR_DEPLOYMENT: local
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - gpu
