version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      node-production:
        dependency-type: production
      node-development:
        dependency-type: development
  - package-ecosystem: pip
    directory: /document_ocr_api
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /document_ocr_api
    schedule:
      interval: weekly
